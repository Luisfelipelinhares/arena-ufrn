
name: Backend CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-sonar:
    name: Testes e análise SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        working-directory: backend
        run: pnpm prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: file:./dev.db

      - name: Executar testes unitários
        working-directory: backend
        run: pnpm test:unit

      - name: Executar testes de integração
        working-directory: backend
        run: pnpm test:integration

      - name: Gerar cobertura
        working-directory: backend
        run: pnpm test:coverage

      - name: Executar análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  smoke-test:
    name: Smoke Test - API em produção
    runs-on: ubuntu-latest
    needs: test-and-sonar
    timeout-minutes: 10
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Verificar saúde da API
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          echo "Aguardando a API ficar saudável..."

          for tentativa in $(seq 1 12); do
            echo "Tentativa $tentativa de 12"

            if curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              "${RENDER_URL}/health"; then
              echo ""
              echo "Smoke Test aprovado!"
              exit 0
            fi

            echo "API indisponível. Nova tentativa em 15 segundos..."
            sleep 15
          done

          echo "A API não respondeu após 12 tentativas."
          exit 1
