name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-sonar:
    name: Testes e análise SonarQube

    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        working-directory: backend
        run: pnpm prisma generate --config prisma7.config.ts
        env:
          DATABASE_URL: file:./dev.db

      - name: Executar testes unitários
        working-directory: backend
        run: pnpm test:unit

      - name: Executar testes de integração
        working-directory: backend
        run: pnpm test:integration

      - name: Gerar cobertura
        working-directory: backend
        run: pnpm test:coverage

      - name: Executar análise SonarQube
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
 
  smoke-test:
    name: Smoke Test - API em produção
    runs-on: ubuntu-latest
    needs: test-and-sonar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Aguardar a publicação no Render
        run: sleep 60

      - name: Verificar saúde da API
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-all-errors \
            "${{ secrets.RENDER_URL }}/health"
